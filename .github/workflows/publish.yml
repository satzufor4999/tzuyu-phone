name: Publish Tzuyu's iPhone
on:
  push:
    branches: [main]
    paths:
      - 'tzuyu-phone-github-ready.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract website
        run: |
          mkdir -p _site
          unzip -q tzuyu-phone-github-ready.zip -d _site
          test -f _site/index.html
          test -f _site/assets/camera-preview.mp4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
